name: Anonymous AI 2027 APK
on:
  workflow_dispatch:
  push:
    branches: [anonymous-android]
    paths: ['.github/workflows/anonymous-apk.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: '0'
      - name: Build standalone ARM64 APK
        working-directory: android
        run: bash gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2
      - name: Verify APK signature and identity
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Anonymous-AI-2027.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/Anonymous-AI-2027.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/Anonymous-AI-2027.apk | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: Anonymous-AI-2027-APK
          path: dist/Anonymous-AI-2027.apk
          if-no-files-found: error
